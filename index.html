<!DOCTYPE html>
<html>
<head>
    <title>Swetha Resume Form</title>
</head>
<body>

    <h1>Swetha Resume</h1>
    
    <form action="#" method="post">
        <h2>Personal Info</h2>
        <p>
            Name: <input type="text" name="name" placeholder="Enter your name">
        </p>
        <p>
            Email: <input type="email" name="email" placeholder="Enter your email">
        </p>
        <p>
            Phone: <input type="tel" name="phone" placeholder="Enter your phone number">
        </p>

        <h2>Education</h2>
        <p>
            Degree: <input type="text" name="degree" placeholder="Enter your degree">
        </p>
        <p>
            Year: <input type="number" name="year" placeholder="Enter year of passing">
        </p>

        <h2>Skills</h2>
        <p>
            Skills: <input type="text" name="skills" placeholder="Enter your skills">
        </p>

        <h2>Projects</h2>
        <p>
            Projects: <input type="text" name="projects" placeholder="Enter your projects">
        </p>

        <p>
          <br> <input type="submit" value="Submit Resume"></br>
        </p>
    </form>

</body>
</html>
